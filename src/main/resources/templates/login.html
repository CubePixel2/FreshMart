<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FreshMart Grocery POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #064e3b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            max-width: 460px;
            width: 100%;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--primary-gradient);
        }
        .demo-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="login-card" data-aos="zoom-in" data-aos-duration="600">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle p-3 mb-2" style="width: 70px; height: 70px;">
            <i class="bi bi-cart4 fs-1"></i>
        </div>
        <h3 class="fw-bold text-dark mt-2 mb-1">Fresh<span class="text-success">Mart</span></h3>
        <p class="text-muted small mb-1">Grocery Store Inventory &amp; Billing System</p>
        <div class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1"><i class="bi bi-geo-alt-fill me-1"></i>Kochi, Kerala &bull; India</div>
    </div>

    <!-- Error Alert -->
    <div class="alert alert-danger alert-dismissible fade show small d-flex align-items-center gap-2" th:if="${errorMessage}">
        <i class="bi bi-exclamation-octagon-fill text-danger fs-5"></i>
        <span th:text="${errorMessage}">Invalid credentials</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Logout Alert -->
    <div class="alert alert-success alert-dismissible fade show small d-flex align-items-center gap-2" th:if="${logoutMessage}">
        <i class="bi bi-check-circle-fill text-success fs-5"></i>
        <span th:text="${logoutMessage}">Logged out successfully</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/login}" method="post" id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold small text-secondary">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" id="username" name="username" class="form-control border-start-0 ps-0" placeholder="Enter username" required autofocus>
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="Enter password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary-gradient w-100 py-2 mt-2 fw-bold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>

    <!-- Quick Demo Autofill Helper -->
    <div class="demo-box text-center">
        <div class="small fw-bold text-secondary mb-2"><i class="bi bi-lightning-charge-fill text-warning me-1"></i>Quick Demo Logins (Kerala Staff)</div>
        <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-sm btn-outline-success px-3" onclick="fillCredentials('admin', 'admin123')">
                <i class="bi bi-shield-lock me-1"></i>Admin
            </button>
            <button type="button" class="btn btn-sm btn-outline-primary px-3" onclick="fillCredentials('staff', 'staff123')">
                <i class="bi bi-person-badge me-1"></i>Staff
            </button>
        </div>
        <div class="text-muted mt-2" style="font-size: 0.72rem;">Click button to auto-fill credentials &bull; Password: <code>admin123</code> / <code>staff123</code></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init({ once: true });

    function fillCredentials(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
    }
</script>
</body>
</html>

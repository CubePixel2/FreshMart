<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('Suppliers')}"></head>
<body>

<div id="app-wrapper">
    <aside th:replace="~{layout/base :: sidebar('suppliers')}"></aside>

    <div id="main-content">
        <header th:replace="~{layout/base :: navbar('Suppliers')}"></header>
        <div th:replace="~{layout/base :: alerts}"></div>

        <main class="page-container">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3" data-aos="fade-down">
                <div>
                    <h3 class="fw-bold mb-1">Supplier Directory</h3>
                    <p class="text-muted mb-0">Manage wholesale vendors, farm distributors, and logistics partners</p>
                </div>
                <button type="button" class="btn btn-primary-gradient d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#supplierModal" onclick="resetSupplierForm()">
                    <i class="bi bi-plus-lg"></i>
                    <span>Add Supplier</span>
                </button>
            </div>

            <!-- Suppliers Grid -->
            <div class="row g-3 mb-4" data-aos="fade-up">
                <div th:each="sup : ${suppliers}" class="col-12 col-md-6 col-xl-4">
                    <div class="card-modern p-4 h-100">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div class="d-flex align-items-center gap-3">
                                <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                    <i class="bi bi-truck fs-5"></i>
                                </div>
                                <div>
                                    <h5 class="fw-bold text-dark mb-0" th:text="${sup.name}">Supplier Name</h5>
                                    <span class="text-muted small" th:text="${sup.contactPerson}">Contact Person</span>
                                </div>
                            </div>
                            <span class="badge bg-light text-secondary border rounded-pill px-2 py-1 small" th:text="${sup.productCount + ' Products'}">0</span>
                        </div>

                        <div class="d-flex flex-column gap-2 text-secondary small mb-3">
                            <div class="d-flex align-items-center gap-2" th:if="${sup.email}">
                                <i class="bi bi-envelope text-primary"></i>
                                <span th:text="${sup.email}">email@vendor.com</span>
                            </div>
                            <div class="d-flex align-items-center gap-2" th:if="${sup.phone}">
                                <i class="bi bi-telephone text-success"></i>
                                <span th:text="${sup.phone}">+1-555-0101</span>
                            </div>
                            <div class="d-flex align-items-center gap-2" th:if="${sup.address}">
                                <i class="bi bi-geo-alt text-danger"></i>
                                <span class="text-truncate" th:text="${sup.address}">Address</span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-1 pt-2 border-top">
                            <button type="button" class="btn btn-sm btn-light text-secondary rounded-circle p-1"
                                    th:attr="data-id=${sup.id}, data-name=${sup.name}, data-contact=${sup.contactPerson}, data-email=${sup.email}, data-phone=${sup.phone}, data-address=${sup.address}"
                                    onclick="editSupplier(this)" title="Edit">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <form th:action="@{'/suppliers/delete/' + ${sup.id}}" method="post" class="d-inline" onsubmit="return confirm('Are you sure? Suppliers with products cannot be deleted.');">
                                <button type="submit" class="btn btn-sm btn-light text-danger rounded-circle p-1" title="Delete">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/base :: footer}"></footer>
    </div>
</div>

<!-- Supplier Modal -->
<div class="modal fade" id="supplierModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <form th:action="@{/suppliers/save}" method="post">
                <input type="hidden" name="id" id="modal-supplier-id">

                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold text-dark" id="modalSupplierTitle">Add New Supplier</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="modal-supplier-name" class="form-label fw-semibold small text-secondary">Company Name *</label>
                        <input type="text" name="name" id="modal-supplier-name" class="form-control" placeholder="e.g. Organic Farms Direct" required>
                    </div>
                    <div class="mb-3">
                        <label for="modal-supplier-contact" class="form-label fw-semibold small text-secondary">Contact Person</label>
                        <input type="text" name="contactPerson" id="modal-supplier-contact" class="form-control" placeholder="e.g. John Doe">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="modal-supplier-email" class="form-label fw-semibold small text-secondary">Email</label>
                            <input type="email" name="email" id="modal-supplier-email" class="form-control" placeholder="orders@vendor.com">
                        </div>
                        <div class="col-6">
                            <label for="modal-supplier-phone" class="form-label fw-semibold small text-secondary">Phone Number</label>
                            <input type="text" name="phone" id="modal-supplier-phone" class="form-control" placeholder="+1-555-0100">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="modal-supplier-address" class="form-label fw-semibold small text-secondary">Office / Warehouse Address</label>
                        <textarea name="address" id="modal-supplier-address" class="form-control" rows="2" placeholder="Street address, City, State..."></textarea>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-gradient px-4">Save Supplier</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
<script>
    function resetSupplierForm() {
        document.getElementById('modalSupplierTitle').textContent = 'Add New Supplier';
        document.getElementById('modal-supplier-id').value = '';
        document.getElementById('modal-supplier-name').value = '';
        document.getElementById('modal-supplier-contact').value = '';
        document.getElementById('modal-supplier-email').value = '';
        document.getElementById('modal-supplier-phone').value = '';
        document.getElementById('modal-supplier-address').value = '';
    }

    function editSupplier(btn) {
        document.getElementById('modalSupplierTitle').textContent = 'Edit Supplier';
        document.getElementById('modal-supplier-id').value = btn.getAttribute('data-id');
        document.getElementById('modal-supplier-name').value = btn.getAttribute('data-name');
        document.getElementById('modal-supplier-contact').value = btn.getAttribute('data-contact') || '';
        document.getElementById('modal-supplier-email').value = btn.getAttribute('data-email') || '';
        document.getElementById('modal-supplier-phone').value = btn.getAttribute('data-phone') || '';
        document.getElementById('modal-supplier-address').value = btn.getAttribute('data-address') || '';

        const modal = new bootstrap.Modal(document.getElementById('supplierModal'));
        modal.show();
    }
</script>

</body>
</html>

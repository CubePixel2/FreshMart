# ===================================================================
# FreshMart Grocery Store Inventory & Billing POS System
# ===================================================================

spring.application.name=FreshMart Grocery POS
server.port=8080

# -------------------------------------------------------------------
# DATABASE CONFIGURATION
# -------------------------------------------------------------------
# By default, FreshMart uses an in-memory/file-based H2 database for 
# instant zero-friction local execution.
#
# To switch to MySQL:
# 1. Comment out the H2 settings below.
# 2. Uncomment the MySQL settings below and ensure your MySQL service is running.
# -------------------------------------------------------------------

# --- DEFAULT: H2 Database Configuration ---
spring.datasource.url=jdbc:h2:mem:groceryposdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- OPTIONAL: MySQL Database Configuration (Uncomment to use MySQL) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/grocery_pos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# JPA & HIBERNATE SETTINGS
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# THYMELEAF SETTINGS
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# LOGGING CONFIGURATION
# -------------------------------------------------------------------
logging.level.com.grocery.pos=INFO
logging.level.org.springframework.security=WARN

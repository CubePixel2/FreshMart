# =====================================================
# FreshMart Grocery Store Inventory & Billing POS System
# =====================================================

spring.application.name=FreshMart Grocery POS
server.port=8080

# =====================================================
# DATABASE CONFIGURATION - Aiven MySQL
# =====================================================
spring.datasource.url=jdbc:mysql://mysql-275033d2-amanshamil786-0cb1.f.aivencloud.com:22181/defaultdb?ssl-mode=REQUIRED&allowPublicKeyRetrieval=true
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA & HIBERNATE SETTINGS
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================
# THYMELEAF SETTINGS
# =====================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# =====================================================
# LOGGING CONFIGURATION
# =====================================================
logging.level.com.grocery.pos=INFO
logging.level.org.springframework.security=WARN

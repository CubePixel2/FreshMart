# ===================================================================
# FreshMart Grocery Store Inventory & Billing POS System
# ===================================================================

spring.application.name=FreshMart Grocery POS
# Dynamic port for Render (falls back to 8080 locally)
server.port=${PORT:8080}

# -------------------------------------------------------------------
# DATABASE CONFIGURATION
# -------------------------------------------------------------------
# By default, FreshMart uses an in-memory H2 database.
# This allows instant, zero-configuration local execution AND instant
# deployment on Render/Heroku/Railway without any external database setup.
# -------------------------------------------------------------------

# --- DEFAULT: In-Memory H2 Database (Recommended for Local & Render Free Deploy) ---
spring.datasource.url=jdbc:h2:mem:groceryposdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- OPTIONAL: MySQL Configuration ---
# NOTE FOR RENDER: Do NOT use "localhost:3306" on Render!
# Render containers do not have MySQL running on localhost.
# Use a cloud MySQL provider (e.g. Aiven, TiDB Cloud, Clever Cloud)
# or provide environment variables in the Render Dashboard (Environment tab):
# SPRING_DATASOURCE_URL=jdbc:mysql://<host>:<port>/<dbname>?useSSL=true&allowPublicKeyRetrieval=true
# SPRING_DATASOURCE_USERNAME=<username>
# SPRING_DATASOURCE_PASSWORD=<password>
#
# Local MySQL (uncomment only when running MySQL locally on your PC):
# spring.datasource.url=jdbc:mysql://localhost:3306/grocery_pos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# JPA & HIBERNATE SETTINGS
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# THYMELEAF SETTINGS
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# LOGGING CONFIGURATION
# -------------------------------------------------------------------
logging.level.com.grocery.pos=INFO
logging.level.org.springframework.security=WARN

# -------------------------------------------------------------------
# PAYMENT GATEWAYS CONFIGURATION
# -------------------------------------------------------------------
payment.gateway.mode=mock
payment.gateway.key=dummy
payment.gateway.secret=dummy

# 1. Razorpay Gateway (Cards, UPI, NetBanking, Wallets)
payment.razorpay.enabled=true
payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_freshmart12345}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:test_secret_key_67890}
payment.razorpay.currency=INR
payment.razorpay.mode=TEST

# 2. Stripe Gateway (International & Domestic Credit/Debit Cards)
payment.stripe.enabled=true
payment.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_freshmart12345}
payment.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_freshmart12345}
payment.stripe.currency=inr
payment.stripe.mode=TEST

# 3. Dynamic UPI QR Gateway (PhonePe, Google Pay, Paytm, BHIM)
payment.upi.enabled=true
payment.upi.vpa=${UPI_MERCHANT_VPA:freshmart.kochi@okaxis}
payment.upi.merchant-name=${UPI_MERCHANT_NAME:FreshMart Supermarket Kochi}

# 4. Counter Card Machine (EDC POS Terminal)
payment.pos-terminal.enabled=true
payment.pos-terminal.terminal-id=EDC-KOCHI-POS-01

